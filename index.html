<!DOCTYPE html>
<html>
<head>
    <style>body { margin: 0; overflow: hidden; background: black; }</style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { Hands } from 'https://cdn.skypack.dev/@mediapipe/hands';
        import { Camera } from 'https://cdn.skypack.dev/@mediapipe/camera_utils';

        // 1. Сцена Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 5;

        // Створення частинок
        const geometry = new THREE.BufferGeometry();
        const particles = 2000;
        const positions = new Float32Array(particles * 3);
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ size: 0.05, vertexColors: true });
        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // 2. Логіка зміни форми (функція для оновлення точок)
        function updateParticles(type) {
            const colors = new Float32Array(particles * 3);
            for(let i=0; i<particles; i++) {
                if(type === 'flag') { // Синьо-жовті частинки
                    colors[i*3] = i < particles/2 ? 0 : 1;
                    colors[i*3+1] = i < particles/2 ? 0 : 1;
                    colors[i*3+2] = 1;
                } else { // Монохром (для тексту)
                    colors[i*3] = colors[i*3+1] = colors[i*3+2] = 1;
                }
            }
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        }

        // 3. MediaPipe Hands
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.onResults(results => {
            if (results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                // Проста логіка жестів
                const isFist = landmarks[8].y > landmarks[6].y; // Спрощено
                if (isFist) updateParticles('text'); 
                else updateParticles('flag');
            }
        });

        // Запуск камери
        const videoElement = document.createElement('video');
        const cameraSource = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cameraSource.start();

        // Рендеринг
        function animate() {
            requestAnimationFrame(animate);
            points.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
