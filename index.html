<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Голосова магія</title>
    <style>
        body { margin: 0; background: #02050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; touch-action: none; }
        .ui { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100; text-align: center; }
        #btn {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3); color: #fff;
            padding: 20px 40px; border-radius: 50px; cursor: pointer;
            font-size: 18px; transition: 0.3s;
        }
        /* Ефект пульсації для інклюзії (показує стан готовності) */
        .listening { border-color: #FFD700 !important; box-shadow: 0 0 20px #FFD700; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="ui"><button id="btn">Натисни та скажи слово</button></div>
<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let particles = [], width, height, targets = [];
    let isListening = false;

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
        }
        update(target) {
            if (target) {
                this.x += (target.x - this.x) * 0.08;
                this.y += (target.y - this.y) * 0.08;
                this.color = target.color;
            } else {
                // Космічний хаос
                this.x += (Math.random() - 0.5) * 2;
                this.y += (Math.random() - 0.5) * 2;
                this.color = `rgba(255, 255, 255, 0.2)`;
            }
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function getTargets(text) {
        const off = document.createElement('canvas');
        const octx = off.getContext('2d');
        off.width = width; off.height = height;
        
        const fontSize = Math.min(width / (text.length > 10 ? 10 : 5), 80);
        octx.font = `bold ${fontSize}px Arial`;
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        
        const words = text.split(' ');
        let lines = [], current = words[0];
        for(let i=1; i<words.length; i++) {
            if(octx.measureText(current + " " + words[i]).width < width * 0.7) current += " " + words[i];
            else { lines.push(current); current = words[i]; }
        }
        lines.push(current);

        let coords = [];
        lines.forEach((line, idx) => {
            const y = height/2 - (lines.length-1)*fontSize/2 + idx*fontSize;
            octx.fillStyle = 'white';
            octx.fillText(line, width/2, y);
        });

        const data = octx.getImageData(0, 0, width, height).data;
        for (let i = 0; i < data.length; i += 32) {
            if (data[i + 3] > 128) {
                const x = (i/4) % width;
                const y = Math.floor((i/4) / width);
                coords.push({x, y, color: y < height/2 ? '#4A90E2' : '#FFD700'});
            }
        }
        return coords;
    }

    function loop() {
        ctx.fillStyle = 'rgba(2, 5, 10, 0.15)';
        ctx.fillRect(0, 0, width, height);
        particles.forEach((p, i) => {
            p.update(targets[i % targets.length]);
            p.draw();
        });
        requestAnimationFrame(loop);
    }

    const btn = document.getElementById('btn');
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = 'uk-UA';
    
    btn.onclick = () => {
        rec.start();
        isListening = true;
        btn.classList.add('listening');
        btn.innerText = "Слухаю...";
    };

    rec.onresult = (e) => {
        targets = getTargets(e.results[0][0].transcript.toUpperCase());
        isListening = false;
        btn.classList.remove('listening');
        btn.innerText = "Скажи ще щось";
    };

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = Array.from({length: 3000}, () => new Particle());
    }

    window.onresize = init;
    init(); loop();
</script>
</body>
</html>
