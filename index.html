<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Голосова магія літер</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: white; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #ff4757; border: none; border-radius: 50px; color: white; }
    </style>
</head>
<body>

    <button id="startBtn">Натисніть і промовте слово</button>
    <canvas id="scene"></canvas>

<script>
    // Налаштування Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'uk-UA';

    const startBtn = document.getElementById('startBtn');
    
    startBtn.addEventListener('click', () => {
        recognition.start();
        startBtn.innerText = "Слухаю...";
    });

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        startBtn.innerText = "Ви сказали: " + transcript;
        console.log("Отримано слово:", transcript);
        
        // Тут викликається логіка розкидання/збору частинок для отриманого тексту
        triggerFormation(transcript.toUpperCase());
    };

    // --- Логіка Canvas (спрощено) ---
    // В реальному проекті тут функція, що перетворює 
    // текст на координати точок (матрицю точок)
    function triggerFormation(text) {
        console.log("Створюємо магію для:", text);
        // Тут частинки переміщуються до точок, що формують слово
    }
</script>
</body>
</html>
