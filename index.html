<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ГУМОВІ ПАЛЬЦІ · ЛЕГКИЙ WARP (мобільний)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0a0f1e;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }
    #canvas {
      transform: scaleX(-1);
    }
    .info {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 20;
      pointer-events: none;
      font-family: monospace;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      padding: 8px;
      margin: 0 16px;
      border-radius: 40px;
      color: #ffcf9a;
      font-size: 14px;
    }
    .led {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 8px;
      background: #ff884d;
      box-shadow: 0 0 6px #ffaa55;
      margin-right: 6px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(1);}
      100% { opacity: 1; transform: scale(1.2);}
    }
    @media (max-width: 600px) {
      .info { font-size: 11px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="info">
    <span class="led"></span> ГУМОВИЙ ВИТЯГ · реальне розтягування пікселів (warp) 
    <span style="margin:0 6px">⚡</span> дві руки → палець тягнеться
  </div>

  <script>
    (function(){
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      // ---- налаштування камери ----
      const video = document.createElement('video');
      video.setAttribute('autoplay', '');
      video.setAttribute('playsinline', '');
      video.style.display = 'none';
      document.body.appendChild(video);
      
      // ---- MediaPipe Hands (легкі налаштування) ----
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,        // швидший, але менш точний – для мобільних
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });
      
      // пальці для warp: вказівний (8) та середній (12)
      const FINGERS = [
        { tip: 8, base: 5 },   // вказівний
        { tip: 12, base: 9 }   // середній
      ];
      
      let frameWidth = 0, frameHeight = 0;
      let lastTimestamp = 0;
      let frameSkipped = false; // для плавності на мобільних
      
      // ---- функція швидкого warp (розтяг текстури) ----
      // малюємо ділянку зображення (від базової точки до оригінального кінчика)
      // і витягуємо її до нової позиції (цільовий кінчик)
      function stretchFingerTexture(srcCanvas, baseX, baseY, origTipX, origTipY, targetTipX, targetTipY, widthPx) {
        // Обчислюємо вектор і довжини
        const dxOrig = origTipX - baseX;
        const dyOrig = origTipY - baseY;
        const origLen = Math.hypot(dxOrig, dyOrig);
        if (origLen < 5) return false;
        
        const dxTarget = targetTipX - baseX;
        const dyTarget = targetTipY - baseY;
        const targetLen = Math.hypot(dxTarget, dyTarget);
        if (targetLen < 5) return false;
        
        // кут повороту
        const angleOrig = Math.atan2(dyOrig, dxOrig);
        const angleTarget = Math.atan2(dyTarget, dxTarget);
        const angleDiff = angleTarget - angleOrig;
        
        // Будуємо тимчасовий canvas для ділянки пальця
        const side = widthPx; // ширина області
        // Вирізаємо квадрат навколо пальця (орієнтований вздовж dxOrig)
        const centerX = baseX + dxOrig * 0.5;
        const centerY = baseY + dyOrig * 0.5;
        
        // Знаходимо bounding box для вирізання з урахуванням кута
        const cos = Math.cos(-angleOrig);
        const sin = Math.sin(-angleOrig);
        // точки чотирикутника в локальній системі
        const halfW = side / 2;
        const halfH = origLen / 2;
        const corners = [
          {x: -halfW, y: -halfH}, {x: halfW, y: -halfH},
          {x: halfW, y: halfH}, {x: -halfW, y: halfH}
        ];
        // повертаємо і зміщуємо
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (let p of corners) {
          const rx = p.x * cos - p.y * sin + centerX;
          const ry = p.x * sin + p.y * cos + centerY;
          minX = Math.min(minX, rx);
          minY = Math.min(minY, ry);
          maxX = Math.max(maxX, rx);
          maxY = Math.max(maxY, ry);
        }
        minX = Math.max(0, Math.floor(minX - 2));
        minY = Math.max(0, Math.floor(minY - 2));
        maxX = Math.min(frameWidth, Math.ceil(maxX + 2));
        maxY = Math.min(frameHeight, Math.ceil(maxY + 2));
        const w = maxX - minX;
        const h = maxY - minY;
        if (w < 8 || h < 8) return false;
        
        // Тимчасовий canvas для вирізаної текстури
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = w;
        tempCanvas.height = h;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(srcCanvas, minX, minY, w, h, 0, 0, w, h);
        
        // Тепер створюємо вихідну текстуру, яку розтягнемо
        // Ми хочемо розтягнути вздовж осі Y (від оригінальної довжини до targetLen)
        // Використаємо Canvas з масштабуванням
        const stretchedCanvas = document.createElement('canvas');
        const stretchFactor = targetLen / origLen;
        // Нова ширина залишається side, висота = origLen * stretchFactor
        const newHeight = Math.max(8, origLen * stretchFactor);
        stretchedCanvas.width = side;
        stretchedCanvas.height = newHeight;
        const stretchCtx = stretchedCanvas.getContext('2d');
        
        // Малюємо текстуру з масштабуванням по Y
        // Спочатку потрібно отримати зображення пальця з tempCanvas в орієнтованому вигляді
        const orientedCanvas = document.createElement('canvas');
        orientedCanvas.width = side;
        orientedCanvas.height = origLen;
        const oriCtx = orientedCanvas.getContext('2d');
        oriCtx.save();
        oriCtx.translate(side/2, origLen/2);
        oriCtx.rotate(angleOrig);
        oriCtx.drawImage(tempCanvas, -w/2, -h/2, w, h);
        oriCtx.restore();
        
        // Масштабуємо по Y
        stretchCtx.drawImage(orientedCanvas, 0, 0, side, origLen, 0, 0, side, newHeight);
        
        // Тепер вставляємо розтягнутий палець у вихідний canvas у правильному місці (від base до targetTip)
        // Обчислимо новий центр для вставки
        const newCenterX = baseX + dxTarget * 0.5;
        const newCenterY = baseY + dyTarget * 0.5;
        const finalAngle = angleTarget;
        
        ctx.save();
        ctx.translate(newCenterX, newCenterY);
        ctx.rotate(finalAngle);
        ctx.drawImage(stretchedCanvas, -side/2, -newHeight/2, side, newHeight);
        ctx.restore();
        
        // Маленьке затемнення на кінчику, щоб сховати стик
        ctx.beginPath();
        ctx.arc(targetTipX, targetTipY, side*0.25, 0, 2*Math.PI);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fill();
        
        return true;
      }
      
      // ---- Основний цикл обробки ----
      let processing = false;
      
      async function processFrame() {
        if (!video.videoWidth || !video.videoHeight) {
          requestAnimationFrame(processFrame);
          return;
        }
        
        const w = video.videoWidth;
        const h = video.videoHeight;
        if (frameWidth !== w || frameHeight !== h) {
          frameWidth = w;
          frameHeight = h;
          canvas.width = w;
          canvas.height = h;
        }
        
        // Отримуємо landmarks (асинхронно, але не блокуємо)
        let landmarksResult;
        try {
          landmarksResult = await hands.send({ image: video });
        } catch(e) {
          requestAnimationFrame(processFrame);
          return;
        }
        
        const handList = landmarksResult.multiHandLandmarks;
        const handsCount = handList ? handList.length : 0;
        
        // Малюємо оригінальний кадр
        ctx.drawImage(video, 0, 0, w, h);
        
        if (handsCount === 2) {
          const handA = handList[0];
          const handB = handList[1];
          
          // Для кожного пальця робимо warp з A до B і з B до A
          for (let f of FINGERS) {
            const baseA = handA[f.base];
            const tipA = handA[f.tip];
            const tipB = handB[f.tip];
            if (baseA && tipA && tipB) {
              const baseX = baseA.x * w;
              const baseY = baseA.y * h;
              const origX = tipA.x * w;
              const origY = tipA.y * h;
              const targetX = tipB.x * w;
              const targetY = tipB.y * h;
              const dist = Math.hypot(targetX - origX, targetY - origY);
              if (dist < 200) { // тільки якщо досить близько, щоб не тягнути надто далеко
                const widthPx = Math.min(45, Math.max(25, 30));
                stretchFingerTexture(canvas, baseX, baseY, origX, origY, targetX, targetY, widthPx);
              }
            }
            
            // Зворотний warp (з B до A)
            const baseB = handB[f.base];
            const tipB = handB[f.tip];
            const tipA = handA[f.tip];
            if (baseB && tipB && tipA) {
              const baseX = baseB.x * w;
              const baseY = baseB.y * h;
              const origX = tipB.x * w;
              const origY = tipB.y * h;
              const targetX = tipA.x * w;
              const targetY = tipA.y * h;
              const dist = Math.hypot(targetX - origX, targetY - origY);
              if (dist < 200) {
                const widthPx = Math.min(45, Math.max(25, 30));
                stretchFingerTexture(canvas, baseX, baseY, origX, origY, targetX, targetY, widthPx);
              }
            }
          }
          
          // Додатково великий палець для ефекту
          const thumbA = handA[4];
          const thumbB = handB[4];
          const thumbBaseA = handA[2];
          const thumbBaseB = handB[2];
          if (thumbA && thumbB && thumbBaseA && thumbBaseB) {
            const baseX = thumbBaseA.x * w, baseY = thumbBaseA.y * h;
            const origX = thumbA.x * w, origY = thumbA.y * h;
            const targetX = thumbB.x * w, targetY = thumbB.y * h;
            stretchFingerTexture(canvas, baseX, baseY, origX, origY, targetX, targetY, 32);
            
            const baseX2 = thumbBaseB.x * w, baseY2 = thumbBaseB.y * h;
            const origX2 = thumbB.x * w, origY2 = thumbB.y * h;
            const targetX2 = thumbA.x * w, targetY2 = thumbA.y * h;
            stretchFingerTexture(canvas, baseX2, baseY2, origX2, origY2, targetX2, targetY2, 32);
          }
        }
        
        // Підказки
        ctx.font = `${Math.max(14, Math.floor(w/40))}px monospace`;
        ctx.shadowBlur = 4;
        ctx.fillStyle = '#fff0c0';
        ctx.shadowColor = 'black';
        if (handsCount < 2) {
          ctx.fillText("✋ + ✋  покажи дві руки → палець видовжується", w/2-150, h-25);
        } else {
          ctx.fillText("⚡ гума працює (розтяг пікселів) ⚡", w/2-130, h-20);
        }
        ctx.shadowBlur = 0;
        
        requestAnimationFrame(processFrame);
      }
      
      // ---- Запуск камери ----
      let camera = null;
      function initCamera() {
        if (camera) camera.stop();
        camera = new Camera(video, {
          onFrame: async () => {},
          width: 640,   // зменшена роздільна здатність для мобільних
          height: 480,
          facingMode: "user"
        });
        camera.start().then(() => {
          console.log("Camera ready");
          processFrame();
        }).catch(err => {
          console.error(err);
          ctx.fillStyle = "#1a1a2e";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#ffb366";
          ctx.font = "16px monospace";
          ctx.fillText("⚠️ Дозвольте доступ до камери", 50, 200);
        });
      }
      
      initCamera();
    })();
  </script>
</body>
</html>
