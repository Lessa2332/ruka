<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Фізичне збирання літер</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        canvas { display: block; }
        .ui { position: absolute; top: 20px; z-index: 10; text-align: center; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 30px; border: none; background: #fff; }
    </style>
</head>
<body>
    <div class="ui">
        <button id="btn">Натисни і скажи слово</button>
    </div>
    <canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    
    // Створюємо 1000 початкових частинок у хаосі
    for(let i=0; i<1000; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            targetX: Math.random() * canvas.width,
            targetY: Math.random() * canvas.height,
            size: Math.random() * 2 + 1
        });
    }

    function animate() {
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
            // Рух до цілі з ефектом "фізичного" прискорення
            p.x += (p.targetX - p.x) * 0.03;
            p.y += (p.targetY - p.y) * 0.03;
            
            ctx.fillStyle = '#00ffcc';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
        requestAnimationFrame(animate);
    }

    // Слухаємо голос
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = 'uk-UA';
    
    document.getElementById('btn').onclick = () => rec.start();

    rec.onresult = (e) => {
        const word = e.results[0][0].transcript.toUpperCase();
        // Спрощене розміщення літер по горизонталі
        particles.forEach((p, index) => {
            p.targetX = (index % word.length) * 150 + 100;
            p.targetY = canvas.height / 2;
        });
    };

    animate();
</script>
</body>
</html>
