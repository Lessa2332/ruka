<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ГУМА-ГУМА NO MI: Реальне видовження пальців (Image Warping)</title>
  <!-- MediaPipe Hands для відстеження -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- Homography.js: легковаговий і високопродуктивний інструмент для реального спотворення зображень -->
  <script src="https://cdn.jsdelivr.net/gh/Eric-Canas/Homography.js@1.4/HomographyLightweight.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0a0f1e;
      overflow: hidden;
      font-family: 'Segoe UI', 'Poppins', system-ui, monospace;
    }
    .canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #canvasOutput {
      transform: scaleX(-1);
      z-index: 2;
    }
    #canvasBackground {
      z-index: 1;
    }
    .info-panel {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 20;
      pointer-events: none;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 60px;
      color: #ffdfb3;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 180, 70, 0.6);
      box-shadow: 0 0 18px rgba(255, 80, 20, 0.4);
    }
    .badge span {
      color: #ffb347;
      font-weight: bold;
    }
    .status-led {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 10px;
      background-color: #ff884d;
      box-shadow: 0 0 8px #ffaa55;
      margin-right: 8px;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(1);}
      100% { opacity: 1; transform: scale(1.2);}
    }
    .watermark {
      position: fixed;
      bottom: 12px;
      right: 16px;
      color: rgba(255,220,150,0.6);
      font-size: 11px;
      font-family: monospace;
      background: rgba(0,0,0,0.4);
      padding: 4px 12px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      pointer-events: none;
      z-index: 20;
    }
    @media (max-width: 600px) {
      .badge { font-size: 0.7rem; padding: 6px 14px; }
    }
  </style>
</head>
<body>
<div class="canvas-container">
  <canvas id="canvasBackground"></canvas>
  <canvas id="canvasOutput"></canvas>
</div>
<div class="info-panel">
  <div class="badge">
    <span class="status-led"></span>
    🧬 РЕАЛЬНЕ ВИТЯГУВАННЯ (WARP) | HOMOGRAFIA 🧬
    <span style="margin:0 6px">⚡</span> ДВІ РУКИ → ПАЛЕЦЬ ТЯГНЕТЬСЯ
  </div>
</div>
<div class="watermark">⚡ справжнє спотворення пікселів (image warping) ⚡</div>

<script>
  (function(){
    // --- Отримуємо canvas ---
    const canvasBg = document.getElementById('canvasBackground');
    const canvasOut = document.getElementById('canvasOutput');
    const ctxBg = canvasBg.getContext('2d');
    const ctxOut = canvasOut.getContext('2d');

    // --- Налаштування відео ---
    const videoElement = document.createElement('video');
    videoElement.setAttribute('autoplay', '');
    videoElement.setAttribute('playsinline', '');
    videoElement.style.display = 'none';
    document.body.appendChild(videoElement);

    // --- MediaPipe Hands ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.7
    });

    // Індекси MediaPipe: великий, вказівний, середній, безіменний, мізинець
    const FINGER_TIPS = [4, 8, 12, 16, 20];
    // Бази пальців (суглоби біля долоні) для кращого витягування: вказівний, середній
    const BASE_INDICES = [5, 9];
    // Додамо повний список пар (база, кінчик), щоб охопити всі пальці але для плавності залишимо основні два
    // але для видовищності додамо також безіменний і мізинець? Вони менш виразні, але можна.
    // Обираю вказівний + середній – найпомітніші.
    const ACTIVE_FINGERS = [
      { base: 5, tip: 8, name: 'index' },
      { base: 9, tip: 12, name: 'middle' }
    ];

    // Розміри зображення
    let imageWidth = 0, imageHeight = 0;

    // Функція для warp (спотворення) фрагмента зображення
    // Використовує Homography.js для перспективного перетворення прямокутної області пальця
    // srcQuad – координати джерела (нормалізовані або абсолютні), dstQuad – координати призначення.
    // Ми будемо передавати координати в пікселях (x, y)
    async function warpFingerRegion(sourceCanvas, srcQuad, dstQuad, outputCtx, dstX, dstY, dstW, dstH) {
      if (!sourceCanvas || srcQuad.length !== 4 || dstQuad.length !== 4) return;
      try {
        // Використовуємо Homography.js: створюємо екземпляр
        const homography = new homography.Homography();
        // Виконуємо перспективне перетворення (проєктивне) – найкраще для витягування
        const warpedImage = await homography.warp({
          image: sourceCanvas,
          srcPoints: srcQuad,   // масив з 4 точок [{x, y}]
          dstPoints: dstQuad,   // куди трансформувати
          type: 'projective',   // проєктивне спотворення -> гума
          precision: 1
        });
        // малюємо спотворене зображення на вихідний canvas (ctxOut) у вказаній позиції
        if (warpedImage) {
          outputCtx.drawImage(warpedImage, dstX, dstY, dstW, dstH);
        }
      } catch(e) {
        console.warn("warp error", e);
      }
    }

    // --- Функція для отримання області навколо пальця (чотирикутник) ---
    // Отримує точку основи та кінчика, повертає 4 точки (кути) прямокутника, орієнтованого вздовж пальця
    function getFingerQuad(baseX, baseY, tipX, tipY, widthFactor = 0.08, lengthExtension = 1.0) {
      // вектор напрямку від основи до кінчика
      let dx = tipX - baseX;
      let dy = tipY - baseY;
      const len = Math.hypot(dx, dy);
      if (len < 0.001) return null;
      dx /= len;
      dy /= len;
      // перпендикулярний вектор
      const perpX = -dy;
      const perpY = dx;
      
      // Ширина області пропорційна довжині пальця (але фіксована основа)
      const baseWidth = (Math.min(0.12, widthFactor * 1.2)) * (imageWidth || 640);
      const tipWidth = (Math.min(0.08, widthFactor * 0.8)) * (imageWidth || 640);
      
      // точки: основа (дві сторони)
      const p1 = { x: baseX + perpX * baseWidth, y: baseY + perpY * baseWidth };
      const p2 = { x: baseX - perpX * baseWidth, y: baseY - perpY * baseWidth };
      // точки кінчика
      const p3 = { x: tipX - perpX * tipWidth, y: tipY - perpY * tipWidth };
      const p4 = { x: tipX + perpX * tipWidth, y: tipY + perpY * tipWidth };
      
      return [p1, p2, p3, p4];
    }

    // Основний процес: копіюємо кадр, визначаємо дві руки, видовжуємо пальці
    async function processFrame() {
      if (!videoElement.videoWidth || !videoElement.videoHeight) {
        requestAnimationFrame(processFrame);
        return;
      }
      
      // Оновлюємо розміри canvas
      const w = videoElement.videoWidth;
      const h = videoElement.videoHeight;
      if (imageWidth !== w || imageHeight !== h) {
        imageWidth = w;
        imageHeight = h;
        canvasBg.width = w;
        canvasBg.height = h;
        canvasOut.width = w;
        canvasOut.height = h;
      }
      
      // Малюємо оригінальний кадр на фоновий canvas (без warp)
      ctxBg.drawImage(videoElement, 0, 0, w, h);
      
      // Отримуємо landmarks
      const results = await hands.send({ image: videoElement });
      const landmarksList = results.multiHandLandmarks;
      const handCount = landmarksList ? landmarksList.length : 0;
      
      // Спочатку копіюємо фон на вихідний canvas (чистий стан)
      ctxOut.clearRect(0, 0, w, h);
      ctxOut.drawImage(canvasBg, 0, 0, w, h);
      
      // Якщо дві руки — робимо warp
      if (handCount === 2) {
        const hand1 = landmarksList[0];
        const hand2 = landmarksList[1];
        
        // Для кожного пальця (base, tip) робимо видовження від руки1 до руки2
        for (let finger of ACTIVE_FINGERS) {
          // Отримуємо базову точку пальця на першій руці та кінчик на другій руці
          const basePoint = hand1[finger.base];
          const tipSelf = hand1[finger.tip];
          const targetTip = hand2[finger.tip];
          if (!basePoint || !tipSelf || !targetTip) continue;
          
          // перетворюємо нормалізовані координати (0-1) у пікселі
          const baseX = basePoint.x * w;
          const baseY = basePoint.y * h;
          const origTipX = tipSelf.x * w;
          const origTipY = tipSelf.y * h;
          const targetX = targetTip.x * w;
          const targetY = targetTip.y * h;
          
          // Відстань між кінчиками: якщо занадто далеко, warp ефект все одно гарний
          // Отримуємо чотирикутник джерела (ділянку навколо пальця від основи до кінчика)
          const srcQuad = getFingerQuad(baseX, baseY, origTipX, origTipY, 0.09, 1.0);
          if (!srcQuad) continue;
          
          // Цільовий чотирикутник: та сама основа, але кінчик витягується до targetTip
          // Злегка розширимо кінчик для плавності
          const dstQuad = getFingerQuad(baseX, baseY, targetX, targetY, 0.09, 1.0);
          if (!dstQuad) continue;
          
          // Форматуємо точки для Homography.js (масив {x, y})
          const srcPoints = srcQuad.map(p => ({ x: p.x, y: p.y }));
          const dstPoints = dstQuad.map(p => ({ x: p.x, y: p.y }));
          
          // Вирізаємо зображення області з canvasBg (оригінальне відео)
          // Краще взяти мінімальний bounding box навколо srcQuad
          let minX = Math.min(...srcQuad.map(p => p.x));
          let minY = Math.min(...srcQuad.map(p => p.y));
          let maxX = Math.max(...srcQuad.map(p => p.x));
          let maxY = Math.max(...srcQuad.map(p => p.y));
          minX = Math.max(0, minX - 15);
          minY = Math.max(0, minY - 15);
          maxX = Math.min(w, maxX + 15);
          maxY = Math.min(h, maxY + 15);
          const regionWidth = maxX - minX;
          const regionHeight = maxY - minY;
          if (regionWidth < 10 || regionHeight < 10) continue;
          
          // Тимчасовий canvas для виділеної ділянки
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = regionWidth;
          tempCanvas.height = regionHeight;
          const tempCtx = tempCanvas.getContext('2d');
          tempCtx.drawImage(canvasBg, minX, minY, regionWidth, regionHeight, 0, 0, regionWidth, regionHeight);
          
          // Коригуємо srcPoints і dstPoints відносно виділеної ділянки
          const srcPointsAdj = srcPoints.map(p => ({ x: p.x - minX, y: p.y - minY }));
          const dstPointsAdj = dstPoints.map(p => ({ x: p.x - minX, y: p.y - minY }));
          
          // Застосовуємо warp до виділеної ділянки
          try {
            const homography = new homography.Homography();
            const warpedImg = await homography.warp({
              image: tempCanvas,
              srcPoints: srcPointsAdj,
              dstPoints: dstPointsAdj,
              type: 'projective',
              precision: 0.5
            });
            if (warpedImg) {
              // Малюємо спотворене зображення поверх вихідного canvas у правильній позиції
              ctxOut.drawImage(warpedImg, minX, minY, regionWidth, regionHeight);
            } else {
              // fallback: просто малюємо оригінальну ділянку
              ctxOut.drawImage(tempCanvas, minX, minY);
            }
          } catch(e) {
            console.debug("warp error", e);
            ctxOut.drawImage(tempCanvas, minX, minY);
          }
          
          // ДОДАТКОВИЙ ЕФЕКТ: також видовжуємо палець із другої руки до першої (симетрично)
          const basePoint2 = hand2[finger.base];
          const tipSelf2 = hand2[finger.tip];
          const targetTip2 = hand1[finger.tip];
          if (basePoint2 && tipSelf2 && targetTip2) {
            const baseX2 = basePoint2.x * w;
            const baseY2 = basePoint2.y * h;
            const origTipX2 = tipSelf2.x * w;
            const origTipY2 = tipSelf2.y * h;
            const targetX2 = targetTip2.x * w;
            const targetY2 = targetTip2.y * h;
            
            const srcQuad2 = getFingerQuad(baseX2, baseY2, origTipX2, origTipY2, 0.09, 1.0);
            if (srcQuad2) {
              const dstQuad2 = getFingerQuad(baseX2, baseY2, targetX2, targetY2, 0.09, 1.0);
              if (dstQuad2) {
                let minX2 = Math.min(...srcQuad2.map(p => p.x));
                let minY2 = Math.min(...srcQuad2.map(p => p.y));
                let maxX2 = Math.max(...srcQuad2.map(p => p.x));
                let maxY2 = Math.max(...srcQuad2.map(p => p.y));
                minX2 = Math.max(0, minX2 - 15);
                minY2 = Math.max(0, minY2 - 15);
                maxX2 = Math.min(w, maxX2 + 15);
                maxY2 = Math.min(h, maxY2 + 15);
                const rw = maxX2 - minX2;
                const rh = maxY2 - minY2;
                if (rw > 10 && rh > 10) {
                  const tempCanvas2 = document.createElement('canvas');
                  tempCanvas2.width = rw;
                  tempCanvas2.height = rh;
                  const tempCtx2 = tempCanvas2.getContext('2d');
                  tempCtx2.drawImage(canvasBg, minX2, minY2, rw, rh, 0, 0, rw, rh);
                  const srcP2 = srcQuad2.map(p => ({ x: p.x - minX2, y: p.y - minY2 }));
                  const dstP2 = dstQuad2.map(p => ({ x: p.x - minX2, y: p.y - minY2 }));
                  const hom2 = new homography.Homography();
                  const warped2 = await hom2.warp({
                    image: tempCanvas2,
                    srcPoints: srcP2,
                    dstPoints: dstP2,
                    type: 'projective'
                  });
                  if (warped2) {
                    ctxOut.drawImage(warped2, minX2, minY2, rw, rh);
                  } else {
                    ctxOut.drawImage(tempCanvas2, minX2, minY2);
                  }
                }
              }
            }
          }
        }
        
        // Додатковий ефект: видовження великого пальця для ще більшої "гума-гума но мі"
        try {
          const thumbTip1 = hand1[4];
          const thumbTip2 = hand2[4];
          const thumbBase1 = hand1[2];
          const thumbBase2 = hand2[2];
          if (thumbTip1 && thumbTip2 && thumbBase1 && thumbBase2) {
            const tx1 = thumbTip1.x * w, ty1 = thumbTip1.y * h;
            const tx2 = thumbTip2.x * w, ty2 = thumbTip2.y * h;
            const bx1 = thumbBase1.x * w, by1 = thumbBase1.y * h;
            const srcThumbQuad = getFingerQuad(bx1, by1, tx1, ty1, 0.07);
            if (srcThumbQuad) {
              const dstThumbQuad = getFingerQuad(bx1, by1, tx2, ty2, 0.07);
              if (dstThumbQuad) {
                let minX = Math.min(...srcThumbQuad.map(p => p.x));
                let minY = Math.min(...srcThumbQuad.map(p => p.y));
                let maxX = Math.max(...srcThumbQuad.map(p => p.x));
                let maxY = Math.max(...srcThumbQuad.map(p => p.y));
                minX = Math.max(0, minX-12);
                minY = Math.max(0, minY-12);
                maxX = Math.min(w, maxX+12);
                maxY = Math.min(h, maxY+12);
                const rw = maxX-minX, rh = maxY-minY;
                if(rw>8 && rh>8){
                  const tCanvas = document.createElement('canvas');
                  tCanvas.width = rw; tCanvas.height = rh;
                  tCanvas.getContext('2d').drawImage(canvasBg, minX, minY, rw, rh, 0, 0, rw, rh);
                  const srcP = srcThumbQuad.map(p=>({x:p.x-minX, y:p.y-minY}));
                  const dstP = dstThumbQuad.map(p=>({x:p.x-minX, y:p.y-minY}));
                  const hg = new homography.Homography();
                  const warpedThumb = await hg.warp({ image: tCanvas, srcPoints: srcP, dstPoints: dstP, type:'projective' });
                  if(warpedThumb) ctxOut.drawImage(warpedThumb, minX, minY, rw, rh);
                }
              }
            }
          }
        } catch(e) { console.warn(e); }
      }
      
      // Малюємо підказки
      ctxOut.font = `bold ${Math.max(18, Math.floor(w / 28))}px 'Segoe UI', monospace`;
      ctxOut.shadowBlur = 6;
      ctxOut.fillStyle = '#fff0d0';
      ctxOut.shadowColor = 'rgba(0,0,0,0.6)';
      if (handCount < 2) {
        ctxOut.fillText("✋ + ✋  покажи дві руки → реальне витягування пікселів", w * 0.5 - 240, h - 40);
        ctxOut.font = `${Math.max(14, Math.floor(w / 38))}px monospace`;
        ctxOut.fillStyle = '#f7c48b';
        ctxOut.fillText("image warping (справжня деформація)", w * 0.5 - 170, h - 18);
      } else {
        ctxOut.font = `${Math.max(15, Math.floor(w / 42))}px monospace`;
        ctxOut.fillStyle = '#ffe5bc';
        ctxOut.fillText("⚡ ГОМОГРАФІЯ АКТИВОВАНА: ПАЛЬЦІ ТЯГНУТЬСЯ ⚡", w * 0.5 - 210, h - 20);
      }
      ctxOut.shadowBlur = 0;
      
      requestAnimationFrame(processFrame);
    }
    
    // Ініціалізація камери та запуск
    let camera = null;
    function startCamera() {
      if (camera) camera.stop();
      camera = new Camera(videoElement, {
        onFrame: async () => {},
        width: 1280,
        height: 720,
        facingMode: "user"
      });
      camera.start().then(() => {
        console.log("Camera started");
        processFrame();
      }).catch(err => {
        console.error("Camera error:", err);
        ctxOut.fillStyle = "#1a1a2e";
        ctxOut.fillRect(0, 0, canvasOut.width, canvasOut.height);
        ctxOut.fillStyle = "#ffb366";
        ctxOut.font = "18px monospace";
        ctxOut.fillText("⚠️ Дозвольте доступ до камери та перезавантажте сторінку", 80, 200);
      });
    }
    
    startCamera();
    videoElement.addEventListener('error', () => setTimeout(startCamera, 1000));
  })();
</script>
</body>
</html>
