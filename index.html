<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Українська Магія ✦ 2027</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #02050a;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.10);
            --text: #f0f4ff;
            --radius: 9999px;
            --shadow: 0 8px 32px rgba(74, 144, 226, 0.15);
            --blue: #4A90E2;
            --gold: #FFD700;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            background: var(--bg);
        }
        .ui {
            position: fixed;
            bottom: max(32px, env(safe-area-inset-bottom, 32px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        .ui button {
            pointer-events: auto;
            appearance: none;
            border: none;
            background: var(--glass);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 42px;
            color: var(--text);
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            font-weight: 500;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: var(--shadow);
            touch-action: manipulation;
            min-width: 200px;
            font-family: inherit;
        }
        .ui button:hover {
            background: rgba(255, 255, 255, 0.10);
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.20);
        }
        .ui button:active {
            transform: scale(0.96);
        }
        .ui button:disabled {
            opacity: 0.6;
            transform: scale(0.98);
            cursor: not-allowed;
        }
        .status {
            pointer-events: none;
            font-size: 0.85rem;
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: opacity 0.4s ease, transform 0.4s ease;
            min-height: 1.6em;
            text-align: center;
            max-width: 90vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #d0d8f0;
        }
        .status.hidden {
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
        }
        @media (max-width: 480px) {
            .ui button {
                padding: 14px 28px;
                min-width: 160px;
                font-size: 0.95rem;
            }
            .status {
                font-size: 0.75rem;
                padding: 4px 14px;
                white-space: normal;
                max-width: 85vw;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="ui" role="toolbar" aria-label="Керування">
        <button id="speechBtn" type="button" aria-label="Натисніть та промовте українською">
            <span aria-hidden="true">🎙</span> Натисни та промов
        </button>
        <div class="status hidden" id="status" role="status" aria-live="polite" aria-atomic="true">Готовий</div>
    </div>
    <canvas id="canvas"></canvas>

    <script type="module">
        // ---- 1. DOM ----
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: false });
        const statusEl = document.getElementById('status');
        const speechBtn = document.getElementById('speechBtn');

        // ---- 2. State ----
        let W = 0,
            H = 0;
        let dpr = 1;
        let particles = [];
        let targets = [];
        let animId = null;
        let recognition = null;

        // ---- 3. Particle ----
        class Particle {
            constructor() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.color = 'rgba(255,255,255,0.2)';
                this.size = 1.8 + Math.random() * 0.8;
            }
            update(target) {
                if (target) {
                    // smooth attraction
                    const dx = target.x - this.x;
                    const dy = target.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    const ease = 0.085;
                    this.x += dx * ease;
                    this.y += dy * ease;
                    this.color = target.color;
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > W) this.vx *= -1;
                    if (this.y < 0 || this.y > H) this.vy *= -1;
                    this.color = 'rgba(255,255,255,0.15)';
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ---- 4. Canvas sizing ----
        function resize() {
            const rect = canvas.getBoundingClientRect();
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = rect.width;
            H = rect.height;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // reinit particles if needed
            const desired = Math.min(4500, Math.max(2000, Math.floor((W * H) / 260)));
            if (particles.length === 0 || Math.abs(particles.length - desired) > 300) {
                particles = Array.from({ length: desired }, () => new Particle());
            }
            targets = [];
        }

        // ---- 5. Generate targets from text (improved) ----
        function generateTargets(text) {
            if (!text || text.trim().length === 0) return [];

            const off = document.createElement('canvas');
            const octx = off.getContext('2d', { alpha: false, willReadFrequently: true });
            off.width = W;
            off.height = H;

            // fill black
            octx.fillStyle = '#000';
            octx.fillRect(0, 0, W, H);

            // font size: adaptive
            const maxWidth = W * 0.88;
            const fontSize = Math.min(
                Math.max(28, maxWidth / (text.length * 0.32)),
                H / 4.2,
                180
            );
            octx.font = `bold ${fontSize}px "Helvetica Neue", Arial, sans-serif`;
            octx.textAlign = 'center';
            octx.textBaseline = 'middle';

            // word wrap
            const words = text.split(/\s+/).filter(w => w.length > 0);
            if (words.length === 0) return [];
            const lines = [];
            let current = words[0];
            for (let i = 1; i < words.length; i++) {
                const test = current + ' ' + words[i];
                if (octx.measureText(test).width < maxWidth) {
                    current = test;
                } else {
                    lines.push(current);
                    current = words[i];
                }
            }
            lines.push(current);

            const lineHeight = fontSize * 1.2;
            const totalH = lines.length * lineHeight;
            const startY = (H - totalH) / 2 + lineHeight / 2;

            octx.fillStyle = '#fff';
            for (let i = 0; i < lines.length; i++) {
                const y = startY + i * lineHeight;
                octx.fillText(lines[i], W / 2, y);
            }

            // sample pixels with step 1 for high density
            const data = octx.getImageData(0, 0, W, H).data;
            const coords = [];
            const midY = H / 2;
            // use step 1 for best quality, but limit total points for performance
            let step = 1;
            // if W*H > 2M, increase step to keep points reasonable
            if (W * H > 2000000) step = 2;

            for (let y = 0; y < H; y += step) {
                const row = y * W * 4;
                for (let x = 0; x < W; x += step) {
                    const idx = row + x * 4;
                    if (data[idx + 3] > 128) {
                        const color = y < midY ? '#4A90E2' : '#FFD700';
                        coords.push({ x, y, color });
                    }
                }
            }

            // if too few points, reduce step to 1 and retry (but we already used step 1 if possible)
            if (coords.length < 200 && step > 1) {
                // fallback: try with step 1
                step = 1;
                // re-sample with step 1 (we can re-run, but for simplicity we just return what we have)
                // Actually we need to re-sample, but we already have data from step 2; we can do a second pass.
                // For simplicity, we'll just increase step to 1 if possible.
                // Since we already set step based on area, we'll just return.
            }

            return coords;
        }

        // ---- 6. Render loop ----
        function render() {
            // fade trail
            ctx.fillStyle = 'rgba(2, 5, 10, 0.18)';
            ctx.fillRect(0, 0, W, H);

            const tLen = targets.length;
            for (let i = 0; i < particles.length; i++) {
                const t = tLen > 0 ? targets[i % tLen] : null;
                particles[i].update(t);
                particles[i].draw();
            }

            animId = requestAnimationFrame(render);
        }

        // ---- 7. Speech Recognition ----
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                statusEl.textContent = '⚠️ Ваш браузер не підтримує голосове введення';
                statusEl.classList.remove('hidden');
                speechBtn.disabled = true;
                return null;
            }

            const rec = new SR();
            rec.lang = 'uk-UA';
            rec.interimResults = false;
            rec.maxAlternatives = 1;
            rec.continuous = false;

            rec.onstart = () => {
                statusEl.textContent = '🎤 Слухаю…';
                statusEl.classList.remove('hidden');
                speechBtn.innerHTML = '⏳ Слухаю…';
                speechBtn.disabled = true;
            };

            rec.onresult = (e) => {
                const transcript = e.results[0]?.[0]?.transcript?.trim() || '';
                if (transcript) {
                    const upper = transcript.toUpperCase();
                    statusEl.textContent = `✨ «${transcript}»`;
                    // generate new targets
                    const newTargets = generateTargets(upper);
                    if (newTargets.length > 100) {
                        targets = newTargets;
                        // ensure particles count is at least targets length (or close)
                        if (particles.length < targets.length * 0.8) {
                            // add more particles
                            const extra = Math.min(targets.length * 1.2 - particles.length, 2000);
                            for (let i = 0; i < extra; i++) {
                                particles.push(new Particle());
                            }
                        }
                    } else {
                        statusEl.textContent = '⚠️ Замало точок, спробуйте коротшу фразу або інший шрифт';
                        targets = [];
                    }
                } else {
                    statusEl.textContent = '😕 Не розпізнано, спробуйте ще';
                    targets = [];
                }
                speechBtn.disabled = false;
                speechBtn.innerHTML = '<span aria-hidden="true">🎙</span> Натисни та промов';
            };

            rec.onerror = (e) => {
                let msg = '❌ Помилка';
                if (e.error === 'not-allowed') msg = '🚫 Доступ до мікрофона заборонено';
                else if (e.error === 'no-speech') msg = '🔇 Не почуто, спробуйте ще';
                else if (e.error === 'audio-capture') msg = '🎧 Мікрофон не знайдено';
                else if (e.error === 'network') msg = '🌐 Перевірте з\'єднання';
                statusEl.textContent = msg;
                statusEl.classList.remove('hidden');
                speechBtn.disabled = false;
                speechBtn.innerHTML = '<span aria-hidden="true">🎙</span> Натисни та промов';
            };

            rec.onend = () => {
                if (!statusEl.textContent.includes('«')) {
                    statusEl.textContent = '🎧 Готовий';
                    statusEl.classList.add('hidden');
                }
                speechBtn.disabled = false;
                speechBtn.innerHTML = '<span aria-hidden="true">🎙</span> Натисни та промов';
            };

            return rec;
        }

        function startListening() {
            if (!recognition) {
                statusEl.textContent = '⚠️ Голосове введення недоступне';
                statusEl.classList.remove('hidden');
                return;
            }
            try {
                recognition.start();
            } catch (_) {
                try { recognition.stop(); } catch (__) {}
                setTimeout(() => {
                    try { recognition.start(); } catch (___ ) {}
                }, 150);
            }
        }

        // ---- 8. Init ----
        function init() {
            resize();
            recognition = initSpeech();
            if (animId) cancelAnimationFrame(animId);
            render();

            // show ready after a moment
            setTimeout(() => {
                statusEl.textContent = '🎧 Готовий';
                statusEl.classList.add('hidden');
            }, 300);
        }

        // ---- 9. Events ----
        const ro = new ResizeObserver(() => resize());
        ro.observe(canvas);
        window.addEventListener('resize', resize, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(resize, 200), { passive: true });

        speechBtn.addEventListener('click', startListening);

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && e.target === document.body) {
                e.preventDefault();
                startListening();
            }
        });

        // ---- 10. Go ----
        init();

        window.addEventListener('beforeunload', () => {
            if (animId) cancelAnimationFrame(animId);
            if (recognition) try { recognition.abort(); } catch (_) {}
            ro.disconnect();
        });
    </script>
</body>
</html>
