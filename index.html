<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Магічні гумові пальці!</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
  </style>
</head>
<body>
  <video id="videoElement" style="display: none;" autoplay playsinline></video>
  <canvas id="canvasElement"></canvas>

  <script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('canvasElement');
    const ctx = canvasElement.getContext('2d');

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7 });

    hands.onResults((results) => {
      canvasElement.width = results.image.width;
      canvasElement.height = results.image.height;
      ctx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
        const hand1 = results.multiHandLandmarks[0];
        const hand2 = results.multiHandLandmarks[1];

        // Кінчики пальців: 8(вказівний), 12(середній), 16(безіменний), 20(мізинець)
        const tips = [8, 12, 16, 20];
        
        tips.forEach(tipIndex => {
          const p1 = hand1[tipIndex];
          const p2 = hand2[tipIndex];
          
          // Рахуємо відстань між кінчиками пальців обох рук
          const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);

          // Якщо пальці близько (менше 0.1 - це "щипок")
          if (dist < 0.15) {
            ctx.beginPath();
            ctx.moveTo(hand1[5].x * canvasElement.width, hand1[5].y * canvasElement.height);
            ctx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
            ctx.lineWidth = 40;
            ctx.strokeStyle = '#fadcbd'; 
            ctx.lineCap = 'round';
            ctx.stroke();
          }
        });
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({image: videoElement}); },
      width: 1280, height: 720
    });
    camera.start();
  </script>
</body>
</html>
