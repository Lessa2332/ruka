<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Гумове видовження пальців · Rubber Finger Stretch</title>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #030507);
      overflow: hidden;
      font-family: 'Segoe UI', 'Poppins', system-ui, monospace;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
      cursor: none;
      z-index: 2;
    }
    .info-panel {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 60px;
      color: #ffdfb3;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 180, 70, 0.5);
      box-shadow: 0 0 15px rgba(255, 100, 20, 0.3);
    }
    .badge span {
      color: #ffb347;
      font-weight: bold;
    }
    .status-led {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 10px;
      background-color: #ff884d;
      box-shadow: 0 0 6px #ffaa55;
      margin-right: 8px;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(1);}
      100% { opacity: 1; transform: scale(1.2);}
    }
    .watermark {
      position: fixed;
      bottom: 12px;
      right: 16px;
      color: rgba(255,220,150,0.6);
      font-size: 11px;
      z-index: 10;
      font-family: monospace;
      background: rgba(0,0,0,0.4);
      padding: 4px 12px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    @media (max-width: 600px) {
      .badge { font-size: 0.7rem; padding: 6px 14px; }
    }
  </style>
</head>
<body>
  <video id="videoElement" style="display: none;" autoplay playsinline muted></video>
  <canvas id="canvasElement"></canvas>
  <div class="info-panel">
    <div class="badge">
      <span class="status-led"></span>
      🧬 ГУМОВЕ ВИДОВЖЕННЯ | REAL RUBBER STRETCH 🧬
      <span style="margin:0 6px">⚡</span> дві руки → пальці тягнуться
    </div>
  </div>
  <div class="watermark">● видовження пальця замість ліній ● справжній гумовий ефект</div>

  <script>
    (function(){
      // --- DOM елементи ---
      const video = document.getElementById('videoElement');
      const canvas = document.getElementById('canvasElement');
      const ctx = canvas.getContext('2d');

      // --- налаштування MediaPipe Hands ---
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.7
      });

      // Індекси ключових точок MediaPipe
      // Для реалістичного видовження беремо основу пальця (суглоб біля долоні) та кінчик.
      // Для вказівного: base = 5 (MCP), tip = 8
      // Для середнього: base = 9? ні, 9 це долоня, краще base = 12? Ні, base має бути 9 або 5? 
      // Правильно: для кожного пальця є своя основа:
      // INDEX: 5 (MCP) -> 8 (tip)
      // MIDDLE: 9 (MCP) -> 12 (tip)
      // RING: 13 -> 16
      // PINKY: 17 -> 20
      // Але для ефекту видовження найкраще виглядає вказівний + середній.
      // Щоб зробити видовження максимально «гумовим», ми використаємо INDEX та MIDDLE.
      
      const STRETCH_FINGERS = [
        { name: 'index', baseIdx: 5, tipIdx: 8 },   // вказівний
        { name: 'middle', baseIdx: 9, tipIdx: 12 }  // середній
      ];
      
      // Додатково для повноти — великий палець теж можна, але він коротший, ефект менш виразний.
      
      // --- кольори шкіри (градієнт для реалістичного видовження) ---
      const SKIN_BASE = '#e2b78d';
      const SKIN_MID = '#d9a56e';
      const SKIN_TIP = '#c68652';
      const NAIL_COLOR = '#f5e2c1';
      
      // --- допоміжна функція: малювання видовженого пальця від основи (base) до цільової точки (targetPoint) ---
      // Щоб виглядало як справжнє видовження, ми малюємо залиту фігуру:
      // від основи пальця (baseX, baseY) до targetPoint, з товщиною, що звужується.
      // Крім того, малюємо текстуру нігтя на кінці.
      function drawStretchedFinger(baseX, baseY, targetX, targetY, originalTipX, originalTipY, widthAtBase = 22, widthAtTip = 12) {
        // Вектор напрямку
        const dx = targetX - baseX;
        const dy = targetY - baseY;
        const length = Math.hypot(dx, dy);
        if (length < 0.01) return;
        
        const angle = Math.atan2(dy, dx);
        const perpX = -Math.sin(angle);
        const perpY = Math.cos(angle);
        
        // Ширина в основі та на кінці (плавне звуження)
        const w1 = widthAtBase;
        const w2 = Math.max(6, widthAtTip * (1 - Math.min(0.6, length / 400))); // чим далі, тим тонший кінчик
        
        // Координати чотирьох кутів трапеції
        const x1a = baseX + perpX * (w1 / 2);
        const y1a = baseY + perpY * (w1 / 2);
        const x1b = baseX - perpX * (w1 / 2);
        const y1b = baseY - perpY * (w1 / 2);
        
        const x2a = targetX + perpX * (w2 / 2);
        const y2a = targetY + perpY * (w2 / 2);
        const x2b = targetX - perpX * (w2 / 2);
        const y2b = targetY - perpY * (w2 / 2);
        
        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        
        // Градієнт уздовж пальця (шкіра)
        const gradient = ctx.createLinearGradient(baseX, baseY, targetX, targetY);
        gradient.addColorStop(0, SKIN_BASE);
        gradient.addColorStop(0.4, SKIN_MID);
        gradient.addColorStop(0.8, SKIN_TIP);
        gradient.addColorStop(1, '#b37b48');
        
        ctx.beginPath();
        ctx.moveTo(x1a, y1a);
        ctx.lineTo(x1b, y1b);
        ctx.lineTo(x2b, y2b);
        ctx.lineTo(x2a, y2a);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();
        
        // Додаємо легкі "зморшки" або лінії згину (для правдоподібності)
        ctx.beginPath();
        ctx.moveTo(baseX + perpX * (w1 * 0.3), baseY + perpY * (w1 * 0.3));
        ctx.lineTo(baseX - perpX * (w1 * 0.3), baseY - perpY * (w1 * 0.3));
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#b57946';
        ctx.shadowBlur = 2;
        ctx.stroke();
        
        // Малюємо "ніготь" на кінці видовження (заокруглений овал)
        const nailSize = w2 * 0.7;
        ctx.beginPath();
        ctx.ellipse(targetX, targetY, nailSize * 0.8, nailSize * 0.5, angle, 0, Math.PI * 2);
        ctx.fillStyle = NAIL_COLOR;
        ctx.shadowBlur = 4;
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(targetX - dx * 0.08, targetY - dy * 0.08, nailSize * 0.5, nailSize * 0.35, angle, 0, Math.PI * 2);
        ctx.fillStyle = '#fff3e0';
        ctx.fill();
        
        // Підсвітка на кінчику (блиск)
        ctx.beginPath();
        ctx.arc(targetX - dx*0.05, targetY - dy*0.05, w2 * 0.2, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,245,210,0.7)';
        ctx.fill();
        
        ctx.restore();
        
        // Перекриваємо оригінальний кінчик пальця (щоб не було роздвоєння) - малюємо пляму кольору шкіри
        ctx.save();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(originalTipX, originalTipY, widthAtTip * 0.8, 0, Math.PI * 2);
        ctx.fillStyle = SKIN_TIP;
        ctx.fill();
        ctx.restore();
      }
      
      // --- Основний колбек MediaPipe ---
      hands.onResults((results) => {
        if (!results.image) return;
        const imgWidth = results.image.width;
        const imgHeight = results.image.height;
        canvas.width = imgWidth;
        canvas.height = imgHeight;
        
        // Відображаємо відеокадр
        ctx.drawImage(results.image, 0, 0, imgWidth, imgHeight);
        
        const landmarksList = results.multiHandLandmarks;
        const handCount = landmarksList ? landmarksList.length : 0;
        
        // Якщо виявлено дві руки — запускаємо магію видовження
        if (handCount === 2) {
          const handA = landmarksList[0];
          const handB = landmarksList[1];
          
          // Для кожного пальця (вказівний + середній) робимо видовження від основи однієї руки до кінчика тієї ж руки?
          // Ні! Щоб палець "видовжився" до пальця другої руки, потрібно взяти основу пальця першої руки, а кінчик — відповідний кінчик другої руки.
          // Саме так створюється ілюзія, що палець тягнеться до іншої руки.
          for (let f of STRETCH_FINGERS) {
            const baseA = handA[f.baseIdx];
            const tipA = handA[f.tipIdx];
            const tipB = handB[f.tipIdx];
            if (!baseA || !tipA || !tipB) continue;
            
            const baseX = baseA.x * imgWidth;
            const baseY = baseA.y * imgHeight;
            const targetX = tipB.x * imgWidth;
            const targetY = tipB.y * imgHeight;
            const origTipX = tipA.x * imgWidth;
            const origTipY = tipA.y * imgHeight;
            
            // Відстань між кінчиками — якщо занадто велика, трохи зменшуємо товщину, але ефект все одно працює
            const dist = Math.hypot(targetX - origTipX, targetY - origTipY);
            // Динамічна товщина: чим далі, тим трохи тонший палець (як справжня гума)
            let baseWidth = 26;
            let tipWidth = 14;
            if (dist > 300) {
              tipWidth = 10;
              baseWidth = 24;
            } else if (dist < 80) {
              tipWidth = 18;
              baseWidth = 28;
            }
            
            // Малюємо видовжений палець від основи першої руки до кінчика другої руки
            drawStretchedFinger(baseX, baseY, targetX, targetY, origTipX, origTipY, baseWidth, tipWidth);
            
            // ТАКОЖ зворотний бік: палець другої руки видовжується до кінчика першої (симетричний ефект)
            const baseB = handB[f.baseIdx];
            if (baseB) {
              const baseBX = baseB.x * imgWidth;
              const baseBY = baseB.y * imgHeight;
              const targetReverseX = tipA.x * imgWidth;
              const targetReverseY = tipA.y * imgHeight;
              const origTipBX = tipB.x * imgWidth;
              const origTipBY = tipB.y * imgHeight;
              drawStretchedFinger(baseBX, baseBY, targetReverseX, targetReverseY, origTipBX, origTipBY, baseWidth, tipWidth);
            }
          }
          
          // Додатковий акцент: "гумові" сполучення між великими пальцями (для стилю)
          const thumbA = handA[4];
          const thumbB = handB[4];
          if (thumbA && thumbB) {
            const x1 = thumbA.x * imgWidth;
            const y1 = thumbA.y * imgHeight;
            const x2 = thumbB.x * imgWidth;
            const y2 = thumbB.y * imgHeight;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineWidth = 18;
            ctx.strokeStyle = '#d49c6c';
            ctx.shadowBlur = 12;
            ctx.stroke();
            ctx.beginPath();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#fcd7a0';
            ctx.stroke();
            ctx.restore();
          }
        }
        
        // --- Підказки та UI ---
        ctx.font = `bold ${Math.max(18, Math.floor(imgWidth / 28))}px 'Segoe UI', monospace`;
        ctx.shadowBlur = 6;
        ctx.fillStyle = '#fff0d0';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        if (handCount < 2) {
          ctx.fillText("✋ + ✋  покажи дві руки → пальці видовжаться", imgWidth * 0.5 - 210, imgHeight - 40);
          ctx.font = `${Math.max(14, Math.floor(imgWidth / 38))}px monospace`;
          ctx.fillStyle = '#f7c48b';
          ctx.fillText("реалістичне гумове видовження (справжній stretch)", imgWidth * 0.5 - 230, imgHeight - 18);
        } else {
          ctx.font = `${Math.max(15, Math.floor(imgWidth / 40))}px monospace`;
          ctx.fillStyle = '#ffe5bc';
          ctx.fillText("🧴 гумові пальці тягнуться один до одного 🧴", imgWidth * 0.5 - 200, imgHeight - 20);
        }
        
        // Додатково малюємо невеликі «іскри» на кінчиках видовжених пальців для ефекту "гума-гума"
        if (handCount === 2) {
          for (let f of STRETCH_FINGERS) {
            const tipA = landmarksList[0][f.tipIdx];
            const tipB = landmarksList[1][f.tipIdx];
            if (tipA && tipB) {
              const ax = tipA.x * imgWidth;
              const ay = tipA.y * imgHeight;
              const bx = tipB.x * imgWidth;
              const by = tipB.y * imgHeight;
              // маленькі зірочки на кінчиках
              for (let i = 0; i < 3; i++) {
                const time = Date.now() / 200;
                const offX = Math.sin(time + i) * 5;
                const offY = Math.cos(time * 1.3 + i) * 5;
                ctx.beginPath();
                ctx.arc(ax + offX, ay + offY, 3 + Math.sin(time)*2, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 200, 100, ${0.5 + Math.sin(time)*0.3})`;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(bx - offX, by + offY, 3 + Math.cos(time*1.2)*2, 0, Math.PI*2);
                ctx.fill();
              }
            }
          }
        }
        
        // скидаємо тіні для наступних кадрів
        ctx.shadowBlur = 0;
      });
      
      // --- Запуск камери ---
      let camera = null;
      function startCamera() {
        if (camera) camera.stop();
        camera = new Camera(video, {
          onFrame: async () => { await hands.send({ image: video }); },
          width: 1280,
          height: 720,
          facingMode: "user"
        });
        camera.start().catch(err => {
          console.error("Camera error:", err);
          ctx.fillStyle = "#1a1a2e";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#ffb366";
          ctx.font = "18px monospace";
          ctx.fillText("⚠️ Доступ до камери заборонено. Дозвольте та оновіть сторінку.", 80, 200);
        });
      }
      startCamera();
      
      // Перезапуск при помилках відео
      video.addEventListener('error', () => {
        console.warn("Video error, retrying...");
        setTimeout(startCamera, 1000);
      });
    })();
  </script>
</body>
</html>
